version: '3.8'

services:
  # ==========================================
  # 1. HADOOP HDFS STORAGE LAYER (WebHDFS: 9870)
  # ==========================================
  namenode:
    image: apache/hadoop:3.3.6
    container_name: bigdata-namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"  # WebHDFS REST API & NameNode Web UI
      - "9000:9000"  # HDFS RPC Server
    environment:
      ENSURE_NAMENODE_DIR: "/opt/hadoop/dfs/name"
      HADOOP_HOME: "/opt/hadoop"
    volumes:
      - hadoop_namenode:/opt/hadoop/dfs/name
    networks:
      - bigdata-net

  datanode:
    image: apache/hadoop:3.3.6
    container_name: bigdata-datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    ports:
      - "9864:9864"  # DataNode Web UI & Data Transfer
    environment:
      HADOOP_HOME: "/opt/hadoop"
    volumes:
      - hadoop_datanode:/opt/hadoop/dfs/data
    depends_on:
      - namenode
    networks:
      - bigdata-net

  # ==========================================
  # 2. APACHE KAFKA (KRaft Mode - No ZooKeeper)
  # ==========================================
  kafka:
    image: bitnami/kafka:3.7.0
    container_name: bigdata-kafka
    hostname: kafka
    ports:
      - "9092:9092"   # External Host Client Port
      - "9094:9094"   # Internal Container Port
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - bigdata-net

  kafka-init-topics:
    image: bitnami/kafka:3.7.0
    container_name: bigdata-kafka-init
    depends_on:
      - kafka
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      # Wait for Kafka broker readiness
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --list
      echo 'Creating Kafka topics for Indian Job Ingestion Pipeline...'
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic job-postings --partitions 3 --replication-factor 1
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic job-postings-spam --partitions 1 --replication-factor 1
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic stream-metrics --partitions 1 --replication-factor 1
      echo 'Topics created successfully:'
      /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --list
      "
    networks:
      - bigdata-net

  # ==========================================
  # 3. APACHE SPARK (3.5 Standalone Cluster)
  # ==========================================
  spark-master:
    image: bitnami/spark:3.5.1
    container_name: bigdata-spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master Port
    volumes:
      - ../:/workspace
    networks:
      - bigdata-net

  spark-worker:
    image: bitnami/spark:3.5.1
    container_name: bigdata-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    volumes:
      - ../:/workspace
    networks:
      - bigdata-net

  # ==========================================
  # 4. BIG DATA FASTAPI BRIDGE SERVICE (Port 8000)
  # ==========================================
  fastapi-bridge:
    build:
      context: ..
      dockerfile: bigdata/Dockerfile
    container_name: bigdata-fastapi-bridge
    ports:
      - "8000:8000"  # REST API bridge for UI (HDFS/Kafka/Spark)
    environment:
      - HDFS_URL=http://namenode:9870
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - SPARK_MASTER=spark://spark-master:7077
      - APP_ENV=docker
    volumes:
      - ../:/app
    depends_on:
      - namenode
      - kafka
      - spark-master
    networks:
      - bigdata-net

volumes:
  hadoop_namenode:
    name: hadoop_namenode
  hadoop_datanode:
    name: hadoop_datanode
  kafka_data:
    name: kafka_data

networks:
  bigdata-net:
    name: bigdata-net
    driver: bridge
